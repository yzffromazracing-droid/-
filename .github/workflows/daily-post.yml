name: Daily Facebook Post

on:
  schedule:
    # 毎日 09:00 JST (= 00:00 UTC)。GitHub側の混雑で数分〜数十分遅れることがあります
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず内容の確認だけ行う"
        type: boolean
        default: true

permissions:
  contents: write  # 投稿した記事を blog/ にコミットするため

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python fb_autopost.py
      - name: Save posted article
        if: ${{ !inputs.dry_run }}
        run: |
          [ -d blog ] || exit 0
          git add blog
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add blog post $(TZ=Asia/Tokyo date +%F)"
          git push
