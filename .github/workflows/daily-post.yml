name: Daily Facebook Post

on:
  schedule:
    # 毎日 09:00 JST (= 00:00 UTC)。GitHub側の混雑で数分〜数十分遅れることがあります
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず内容の確認だけ行う"
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python fb_autopost.py
